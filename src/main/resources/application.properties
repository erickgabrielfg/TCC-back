server.port=${PORT:8090}

spring.jpa.database=POSTGRESQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

server.servlet.context-path=/ecos-api

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/oisol-pkey.pem

sps.oisol.jwt.keystore.jks-location=classpath:keys/oisol.jks
sps.oisol.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
sps.oisol.jwt.keystore.keypair-alias=${JWT_KEYPAIR_ALIAS:oisol}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL94Dialect

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

app.version=@project.version@
app.name=@project.name@


spring.mail.host=${MAIL_HOST:smtp.mailgun.org}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.freemarker.settings.locale=pt_BR

sps.oisol.email.remetente=${MAIL_FROM:Ecos <no-reply@example.com>}
sps.oisol.email.impl=${MAIL_IMPL:SMTP}

ecos.storage.local.anexos=${ECOS_STORAGE_LOCAL_ANEXOS:/tmp}

ecos.storage.minio.bucket=${MINIO_BUCKET:ecos}
ecos.storage.minio.raiz=${MINIO_RAIZ:./}
ecos.storage.minio.name=${MINIO_ACCESS_KEY:}
ecos.storage.minio.secret=${MINIO_SECRET_KEY:}
ecos.storage.minio.url=${MINIO_URL:}